name: Fetch Hub Data

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Give the job permission to write to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # This line enables dependency caching

      - name: Install dependencies
        run: npm ci # Using 'ci' is recommended for CI environments for faster, more reliable installs

      - name: Fetch and save data
        run: node fetch-json.js

      - name: Sync city list
        run: node build-cities.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hub-data/*.json
          # Check if there are changes to commit to avoid empty commits
          if ! git diff --staged --quiet; then
            # Note what changed so the next step can purge just those files.
            # quotePath=false keeps non-ASCII names (hubs-düsseldorf.json) readable.
            changed=$(git -c core.quotePath=false diff --staged --name-only)
            git commit -m "🤖 Auto-update hub data"
            git push
            # Only recorded once the push succeeds, so a failed push never
            # re-caches the old files for another 12 hours.
            printf '%s\n' "$changed" > "$RUNNER_TEMP/changed.txt"
          else
            echo "No changes to commit."
          fi

      - name: Purge jsDelivr cache
        # jsDelivr caches @main URLs for 12 hours, so the site would otherwise
        # serve stale hub data until the TTL expires. Best-effort: never fail the
        # run over a purge.
        continue-on-error: true
        run: |
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            node purge-jsdelivr.js < "$RUNNER_TEMP/changed.txt"
          else
            echo "Nothing committed — no cache to purge."
          fi
